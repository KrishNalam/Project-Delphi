# Copy to profile.yaml (gitignored). This is what forms get filled from.
first_name:
last_name:
email:
phone:
city: Toronto, ON, Canada
linkedin:
github:
website:

school: University of Toronto
degree:
major:
grad_date: # e.g. 2028-04
year_of_study: # e.g. 3rd year undergrad
gpa:

work_auth:
    canada: Authorized to work, no sponsorship needed
    usa: Requires visa sponsorship
needs_us_sponsorship: true # drops US postings that say they won't sponsor
degree_level: Bachelor's # drops postings that list only other degrees (e.g. PhD-only); blank = keep all
terms: [Summer 2027] # drops postings that list only other terms (Winter 2027, ...); blank = keep all

search_terms: # LinkedIn / Indeed searches
    - software engineering intern
    - software developer co-op
    - machine learning intern
    - data science intern

# Typed into Workday's My Experience when its resume reader leaves it empty. Newest first.
experience:
    - title: Software Engineer Intern
      company: Acme
      location: Toronto, ON
      start: 2026-05 # YYYY-MM
      end: present # or YYYY-MM
      description: |
          • What you built and the impact
skills: [Python, Java, SQL]

resume_pdf: /home/krish/resume.pdf
transcript_pdf: # optional, uploaded where a form asks for a transcript

# Voluntary self-identification. Blank = "decline to answer".
eeo:
    gender:
    race:
    veteran:
    disability:

resume_text: |
    Paste your resume as plain text. Used for ranking jobs and answering short questions.
